<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca MUNUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Colores del manual de marca MUNUS */
  :root {
    --bg: #041E42;      /* Midnight Blue, Junta 2027 */
    --gold: #B59868;    /* Dorado protocolario */
    --navy: #041E42;    /* Midnight Blue, Junta 2027 */
    --text: #FFFBF5;    /* Sugar Milk */
    --muted: #c9cfdb;
    --oak: #3b2416;     /* Roble oscuro */
    --oak-top: #6b4630;
    --hoja: 0 14px 0 14px; /* forma de botón MUNUS: sin redondeo arriba-izq y abajo-der */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Fondo de laureles: se dibuja en un lienzo fijo detrás de todo */
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  /* ---------- Biblioteca ---------- */
  header { text-align: center; padding: 48px 16px 8px; }
  header h1 {
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 4.4rem);
    letter-spacing: .08em;
    color: var(--gold);
  }
  header p {
    font-family: Inter, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .14em;
    line-height: 50px;
    color: var(--gold);
    font-size: clamp(.85rem, 2vw, 1.05rem);
  }

  .estante {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(16px, 5vw, 64px);
    padding: 80px 16px 0;
    max-width: 1100px;
    margin: 0 auto;
  }
  .estante::after {
    content: "";
    position: absolute;
    left: 5%; right: 5%; bottom: -22px;
    height: 26px;
    /* Roble oscuro con veta de madera */
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 38px, rgba(0,0,0,.18) 39px, rgba(0,0,0,0) 41px 97px, rgba(255,255,255,.05) 98px, rgba(0,0,0,0) 100px),
      linear-gradient(var(--oak-top), var(--oak) 45%, #2a190f);
    border-radius: 4px;
    box-shadow: 0 16px 26px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.18);
  }

  .libro {
    position: relative;
    width: clamp(90px, 24vw, 230px);
    cursor: pointer;
    text-align: center;
    perspective: 1200px;
    background: none; border: none; color: inherit; font: inherit;
  }
  .libro.central { width: clamp(105px, 28vw, 270px); transform: translateY(-48px); }
  .tapa {
    position: relative;
    aspect-ratio: var(--ratio, 0.707);
    border-radius: 3px 8px 8px 3px;
    background: #24365a;
    /* filo dorado + halo para separar la portada azul del fondo */
    box-shadow: 0 0 0 1px rgba(181,152,104,.45), 0 0 34px rgba(181,152,104,.18),
                0 14px 28px rgba(0,0,0,.6), inset 6px 0 10px rgba(0,0,0,.35);
    transform-origin: left center;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
    overflow: hidden;
  }
  .tapa canvas, .tapa img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .tapa::before { /* lomo */
    content: ""; position: absolute; inset: 0 auto 0 0; width: 9%;
    background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.12) 60%, rgba(0,0,0,0));
    z-index: 1;
  }
  .tapa .cargando {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: .8rem;
  }
  .libro:hover .tapa, .libro:focus-visible .tapa {
    transform: rotateY(-18deg) translateY(-8px);
    box-shadow: 0 0 0 1px rgba(181,152,104,.7), 0 0 44px rgba(181,152,104,.28),
                18px 22px 36px rgba(0,0,0,.6), inset 6px 0 10px rgba(0,0,0,.35);
  }
  .libro:focus-visible { outline: 2px solid var(--gold); outline-offset: 8px; border-radius: 6px; }
  .libro .nombre {
    font-family: Inter, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .14em;
    line-height: 50px;
    font-size: clamp(.8rem, 1.8vw, 1rem);
    margin-top: 8px;
    color: var(--gold);
  }

  /* ---------- Controles de sonido ---------- */
  .audio {
    position: fixed; top: 14px; right: 14px; z-index: 30;
    display: flex; gap: 8px;
  }
  /* Todos los botones con la forma de hoja MUNUS */
  .audio button, .cerrar, .nav button {
    background: rgba(4,30,66,.75);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: var(--hoja);
    padding: 9px 16px;
    font: 600 .8rem Inter, sans-serif;
    text-transform: uppercase;
    letter-spacing: .1em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .2s, color .2s;
  }
  .audio button:hover, .cerrar:hover, .nav button:hover { background: var(--gold); color: var(--bg); }
  .nav button { font-size: 1.1rem; padding: 6px 18px; }
  .audio button[aria-pressed="false"] { opacity: .5; }

  /* ---------- Lector ---------- */
  .lector {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(1,10,26,.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 16px 80px;
  }
  .lector.abierto { display: flex; }
  .lector h2 {
    position: absolute; top: 18px; left: 16px;
    font-family: "Playfair Display", serif; color: var(--gold); font-size: 1.3rem;
  }
  .cerrar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); }
  #flipbook { box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .pagina { background: #fff; overflow: hidden; }
  .pagina img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .pagina .cargando { height: 100%; display: grid; place-items: center; color: #889; font-size: .9rem; }
  .nav {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 14px;
  }
  .nav span { color: var(--muted); font-size: .9rem; min-width: 90px; text-align: center; }
  .estado { color: var(--muted); }

  @media (max-width: 560px) {
    .estante { padding-top: 70px; }
    .libro.central { transform: translateY(-28px); }
    .lector h2 { display: none; }
  }
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>

<div class="audio">
  <button id="btnMusica" aria-pressed="false" title="Música de fondo">♪ Música</button>
  <button id="btnSonido" aria-pressed="true" title="Sonido al pasar página">Sonido</button>
</div>

<header>
  <h1>HANDBOOKS</h1>
  <p>Elige tu manual perfecto</p>
</header>

<main class="estante" id="estante"></main>

<section class="lector" id="lector" aria-hidden="true">
  <h2 id="tituloLector"></h2>
  <button class="cerrar" id="cerrar">✕ Cerrar</button>
  <div id="contenedorLibro"></div>
  <div class="nav">
    <button id="ant" aria-label="Página anterior">‹</button>
    <span id="contador"></span>
    <button id="sig" aria-label="Página siguiente">›</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN — aquí cambias los libros y la música.
   El orden es: izquierda, centro, derecha.
   "pdf" es el enlace directo al PDF (alojado en GitHub Pages).
   Para cambiar un manual, reemplaza el PDF en GitHub con el mismo nombre.
   ========================================================= */
const SITIO = "https://g-i-d.github.io/biblioteca-munus/";
const BASE = SITIO + "libros/";
const LIBROS = [
  { titulo: "Bienestar", pdf: BASE + "Handbook_Bienestar_MUNUS.pdf" },
  { titulo: "General",   pdf: BASE + "Handbook_General_MUNUS.pdf", central: true },
  { titulo: "Crisis",    pdf: BASE + "Handbook_Crisis_MUNUS.pdf" },
];
// Enlace a un MP3 para la música de fondo. Si se deja vacío, suena un lofi original
// generado en el navegador (sin derechos de autor, sin fin y sin loop audible).
const MUSICA_URL = "";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const docs = {}; // caché de PDFs cargados
function cargarPDF(url) {
  if (!docs[url]) docs[url] = pdfjsLib.getDocument(url).promise;
  return docs[url];
}

async function renderPagina(pdf, n, anchoObjetivo) {
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const escala = (anchoObjetivo * Math.min(window.devicePixelRatio || 1, 2)) / base.width;
  const vp = page.getViewport({ scale: escala });
  const canvas = document.createElement("canvas");
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  return canvas;
}

(async function dibujarFondo() {
  const lienzo = document.getElementById("fondo");
  const bytes = Uint8Array.from(atob(FONDO.split(",")[1]), c => c.charCodeAt(0));
  const cuadro = await createImageBitmap(new Blob([bytes], { type: "image/png" }));
  function pintar() {
    const dpr = window.devicePixelRatio || 1;
    lienzo.width = Math.round(innerWidth * dpr);
    lienzo.height = Math.round(innerHeight * dpr);
    const g = lienzo.getContext("2d");
    const patron = g.createPattern(cuadro, "repeat");
    patron.setTransform(new DOMMatrix().scale(dpr));
    g.fillStyle = patron;
    g.fillRect(0, 0, lienzo.width, lienzo.height);
  }
  pintar();
  window.addEventListener("resize", pintar);
})();

/* ---------- Estante con portadas ---------- */
const estante = document.getElementById("estante");
// Quita escuchas de una ejecución anterior (clonar un botón borra sus eventos)
["btnMusica", "btnSonido", "cerrar", "ant", "sig"].forEach(id => {
  const el = document.getElementById(id);
  el.replaceWith(el.cloneNode(true));
});
estante.innerHTML = ""; // Canva puede ejecutar el código dos veces: así no se duplican los libros
LIBROS.forEach((libro, i) => {
  const btn = document.createElement("button");
  btn.className = "libro" + (libro.central ? " central" : "");
  btn.innerHTML = `<div class="tapa"><div class="cargando">Cargando…</div></div>
                   <div class="nombre">${libro.titulo}</div>`;
  btn.setAttribute("aria-label", "Abrir manual " + libro.titulo);
  btn.addEventListener("click", () => abrirLibro(libro));
  estante.appendChild(btn);

  cargarPDF(libro.pdf).then(async pdf => {
    const page = await pdf.getPage(1);
    const vp = page.getViewport({ scale: 1 });
    btn.querySelector(".tapa").style.setProperty("--ratio", vp.width / vp.height);
    const canvas = await renderPagina(pdf, 1, 300);
    const tapa = btn.querySelector(".tapa");
    tapa.innerHTML = "";
    tapa.appendChild(canvas);
  }).catch(() => {
    btn.querySelector(".cargando").textContent = "No se pudo cargar el PDF";
  });
});

/* ---------- Lector con efecto de libro ---------- */
const lector = document.getElementById("lector");
const contenedor = document.getElementById("contenedorLibro");
const contador = document.getElementById("contador");
let flip = null, pdfActual = null, anchoPagina = 0, renderizadas = new Set();

async function abrirLibro(libro) {
  arrancarAudio();
  lector.classList.add("abierto");
  lector.setAttribute("aria-hidden", "false");
  document.getElementById("tituloLector").textContent = "Manual " + libro.titulo;
  contenedor.innerHTML = '<p class="estado">Abriendo libro…</p>';
  contador.textContent = "";

  pdfActual = await cargarPDF(libro.pdf);
  const p1 = await pdfActual.getPage(1);
  const vp = p1.getViewport({ scale: 1 });
  const ratio = vp.height / vp.width;

  // Tamaño de página que quepa en pantalla (dos páginas lado a lado en pantallas anchas)
  const dosPaginas = window.innerWidth > 760;
  const maxAlto = window.innerHeight - 160;
  const maxAncho = (window.innerWidth - 40) / (dosPaginas ? 2 : 1);
  anchoPagina = Math.floor(Math.min(maxAncho, maxAlto / ratio));
  const altoPagina = Math.floor(anchoPagina * ratio);

  contenedor.innerHTML = '<div id="flipbook"></div>';
  const fb = document.getElementById("flipbook");
  for (let n = 1; n <= pdfActual.numPages; n++) {
    const d = document.createElement("div");
    d.className = "pagina";
    d.dataset.n = n;
    d.innerHTML = '<div class="cargando">Página ' + n + '</div>';
    fb.appendChild(d);
  }

  renderizadas = new Set();
  flip = new St.PageFlip(fb, {
    width: anchoPagina, height: altoPagina,
    size: "fixed",
    showCover: true,
    usePortrait: !dosPaginas,
    maxShadowOpacity: 0.5,
    mobileScrollSupport: false,
    flippingTime: 800,
  });
  flip.loadFromHTML(fb.querySelectorAll(".pagina"));
  flip.on("flip", e => { sonidoPagina(); actualizar(e.data); });
  actualizar(0);
}

function actualizar(indice) {
  const total = pdfActual.numPages;
  contador.textContent = `${indice + 1} / ${total}`;
  // Dibuja las páginas cercanas a la actual (así no se cargan todas de golpe)
  for (let n = Math.max(1, indice - 2); n <= Math.min(total, indice + 7); n++) {
    if (renderizadas.has(n)) continue;
    renderizadas.add(n);
    const pdf = pdfActual;
    renderPagina(pdf, n, anchoPagina).then(canvas => {
      if (pdf !== pdfActual) return;
      const div = contenedor.querySelector(`.pagina[data-n="${n}"]`);
      if (!div) return;
      const img = document.createElement("img");
      img.src = canvas.toDataURL("image/jpeg", 0.9);
      img.alt = "Página " + n;
      div.innerHTML = "";
      div.appendChild(img);
    });
  }
}

function cerrarLibro() {
  if (flip) { flip.destroy(); flip = null; }
  pdfActual = null;
  contenedor.innerHTML = "";
  lector.classList.remove("abierto");
  lector.setAttribute("aria-hidden", "true");
}

document.getElementById("cerrar").addEventListener("click", cerrarLibro);
document.getElementById("ant").addEventListener("click", () => flip && flip.flipPrev());
document.getElementById("sig").addEventListener("click", () => flip && flip.flipNext());
document.onkeydown = e => {
  if (!flip) return;
  if (e.key === "ArrowRight") flip.flipNext();
  if (e.key === "ArrowLeft") flip.flipPrev();
  if (e.key === "Escape") cerrarLibro();
};

/* ---------- Sonido de página y música ---------- */
let ctx = null, sonidoOn = true, musicaOn = false, musicaNodo = null, audioMp3 = null;
const btnMusica = document.getElementById("btnMusica");
const btnSonido = document.getElementById("btnSonido");

function arrancarAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
}

function sonidoPagina() {
  if (!sonidoOn || !ctx) return;
  // Ráfaga de ruido filtrado: imita el roce de una hoja de papel
  const dur = 0.45;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const t = i / data.length;
    data[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * t), 2) * (0.6 + 0.4 * Math.random());
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(1800, ctx.currentTime);
  bp.frequency.linearRampToValueAtTime(4200, ctx.currentTime + dur);
  const g = ctx.createGain(); g.gain.value = 0.35;
  src.connect(bp).connect(g).connect(ctx.destination);
  src.start();
}

function iniciarMusica() {
  if (MUSICA_URL) {
    if (!audioMp3) { audioMp3 = new Audio(MUSICA_URL); audioMp3.loop = true; audioMp3.volume = 0.35; }
    audioMp3.play();
    return;
  }
  musicaNodo = lofi();
}

function detenerMusica() {
  if (audioMp3) audioMp3.pause();
  if (musicaNodo) { musicaNodo.parar(); musicaNodo = null; }
}

/* ---------- Lofi generativo ----------
   Música original creada en el momento: acordes de piano eléctrico, bajo, batería suave
   y crujido de vinilo. La estructura dura ~10 minutos y la melodía y la batería
   varían cada vez, así que al volver a empezar no se nota el loop. */
function lofi() {
  const BPM = 78, SEMI = 60 / BPM / 4; // duración de una semicorchea
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  // Cadena de salida: filtro cálido + compresor + volumen general
  const master = ctx.createGain(); master.gain.value = 0;
  master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 4);
  const calido = ctx.createBiquadFilter(); calido.type = "lowpass"; calido.frequency.value = 3800;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  master.connect(calido).connect(comp).connect(ctx.destination);

  // Reverb generada
  const reverb = ctx.createConvolver();
  const ir = ctx.createBuffer(2, ctx.sampleRate * 2.6, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  }
  reverb.buffer = ir;
  const reverbVol = ctx.createGain(); reverbVol.gain.value = 0.35;
  reverb.connect(reverbVol).connect(master);

  const ruido = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  ruido.getChannelData(0).forEach((_, i, d) => d[i] = Math.random() * 2 - 1);

  // Crujido de vinilo (7 s con chasquidos al azar)
  const vin = ctx.createBuffer(1, ctx.sampleRate * 7, ctx.sampleRate);
  const vd = vin.getChannelData(0);
  for (let i = 0; i < vd.length; i++) {
    vd[i] = (Math.random() * 2 - 1) * 0.004;
    if (Math.random() < 0.00012) vd[i] = (Math.random() * 2 - 1) * 0.6;
  }
  const vinilo = ctx.createBufferSource(); vinilo.buffer = vin; vinilo.loop = true;
  const vinHP = ctx.createBiquadFilter(); vinHP.type = "highpass"; vinHP.frequency.value = 900;
  const vinVol = ctx.createGain(); vinVol.gain.value = 0.25;
  vinilo.connect(vinHP).connect(vinVol).connect(master);
  vinilo.start();

  // ---- Instrumentos ----
  function piano(n, t, dur, vel) {
    const f = midi(n);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.07 * vel, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.025 * vel, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1700;
    g.connect(lp); lp.connect(master); lp.connect(reverb);
    [[1, 1], [2.001, 0.18], [3, 0.05]].forEach(([m, a]) => {
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.value = f * m; o.detune.value = (Math.random() - 0.5) * 8; // leve desafinación de cinta
      const og = ctx.createGain(); og.gain.value = a;
      o.connect(og).connect(g); o.start(t); o.stop(t + dur + 0.7);
    });
  }
  function campana(n, t, vel) {
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = midi(n);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05 * vel, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); g.connect(master); g.connect(reverb);
    o.start(t); o.stop(t + 1.7);
  }
  function bajo(n, t, dur) {
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = midi(n);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 400;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.02);
    g.gain.setTargetAtTime(0, t + dur, 0.08);
    o.connect(lp).connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.5);
  }
  function bombo(t, vel) {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.55 * vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
  }
  function caja(t, vel) {
    const s = ctx.createBufferSource(); s.buffer = ruido;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1700; bp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.22 * vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    s.connect(bp).connect(g); g.connect(master); g.connect(reverb);
    s.start(t, Math.random() * 0.5); s.stop(t + 0.22);
  }
  function platillo(t, vel) {
    const s = ctx.createBufferSource(); s.buffer = ruido;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.06 * vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(hp).connect(g).connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + 0.06);
  }

  // ---- Armonía (Mi bemol mayor: cálida e inspiradora) ----
  const AC = {
    Eb: [39, [51, 55, 58, 62]], Cm: [36, [51, 55, 58, 62]], Ab: [44, [51, 55, 56, 60]],
    Bb: [46, [50, 53, 55, 58]], Gm: [43, [50, 53, 55, 58]], Fm: [41, [51, 55, 56, 60]],
    Bbs: [46, [51, 55, 56, 60]],
  };
  const PROG = [
    ["Eb", "Cm", "Ab", "Bb"],
    ["Ab", "Bb", "Gm", "Cm"],
    ["Fm", "Bbs", "Eb", "Cm"],
    ["Ab", "Gm", "Fm", "Bb"],
  ];
  // Plan de ~10 min: [progresión, batería (0 nada, 1 suave, 2 completa), melodía]
  const PLAN = [
    [0,0,0],[0,1,0],[0,2,1],[1,2,1],[2,2,1],[3,2,0],[0,1,1],[1,2,1],
    [2,2,1],[3,2,1],[2,0,1],[1,1,0],[0,2,1],[3,2,1],[2,2,0],[1,2,1],
    [0,1,1],[3,0,0],[2,1,1],[1,2,1],[0,2,1],[3,2,1],[2,1,0],[3,1,1],
  ]; // 24 secciones × 8 compases ≈ 9,8 minutos
  const PENTA = [63, 65, 67, 70, 72, 75, 77, 79, 82];

  let paso = 0, siguiente = ctx.currentTime + 0.3, notaMel = 4;
  function programar(t) {
    const compas = Math.floor(paso / 16), s = paso % 16;
    const [p, bat, mel] = PLAN[Math.floor(compas / 8) % PLAN.length];
    const [raiz, voces] = AC[PROG[p][compas % 4]];
    const swing = (s % 2 === 1) ? SEMI * 0.28 : 0;
    const tt = t + swing;

    if (s === 0) {
      voces.forEach((n, i) => piano(n, t + i * 0.018, SEMI * 14, 0.9 + Math.random() * 0.2));
      bajo(raiz, t, SEMI * 6);
    }
    if (s === 10 && Math.random() < 0.6) { // golpe suave de acorde a contratiempo
      voces.slice(1).forEach((n, i) => piano(n, tt + i * 0.015, SEMI * 5, 0.5));
      bajo(raiz + (Math.random() < 0.5 ? 7 : 12), tt, SEMI * 4);
    }
    if (bat >= 1 && s % 2 === 0) platillo(tt, s % 4 === 0 ? 1 : 0.6);
    if (bat === 2 && s % 2 === 1 && Math.random() < 0.15) platillo(tt, 0.4);
    if (bat >= 1 && s === 0) bombo(t, 1);
    if (bat === 2) {
      if (s === 7 || (s === 10 && Math.random() < 0.7)) bombo(tt, 0.8);
      if (s === 4 || s === 12) caja(t, 1);
    }
    if (mel && s % 2 === 0 && Math.random() < 0.28) { // melodía pentatónica que camina
      notaMel = Math.max(0, Math.min(PENTA.length - 1, notaMel + Math.floor(Math.random() * 5) - 2));
      campana(PENTA[notaMel], tt, 0.7 + Math.random() * 0.3);
    }
  }
  const timer = setInterval(() => {
    while (siguiente < ctx.currentTime + 0.25) { programar(siguiente); siguiente += SEMI; paso++; }
  }, 50);

  return {
    parar() {
      clearInterval(timer);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
      setTimeout(() => { vinilo.stop(); master.disconnect(); }, 1200);
    },
  };
}

btnMusica.addEventListener("click", () => {
  arrancarAudio();
  musicaOn = !musicaOn;
  btnMusica.setAttribute("aria-pressed", musicaOn);
  musicaOn ? iniciarMusica() : detenerMusica();
});
btnSonido.addEventListener("click", () => {
  arrancarAudio();
  sonidoOn = !sonidoOn;
  btnSonido.setAttribute("aria-pressed", sonidoOn);
});
</script>
